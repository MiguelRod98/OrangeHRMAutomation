webdriver {
  driver = "chrome"
}

webdriver {
  capabilities {
    "goog:chromeOptions" {
      args = [
        "incognito", "ignore-certificate-errors", "disable-infobars",
        "disable-gpu", "disable-default-apps", "disable-popup-blocking", 
        "remote-allow-origins=*", "--headless", "--no-sandbox", 
        "--disable-dev-shm-usage", "--window-size=1920,1080", "--disable-extensions",
        "--disable-web-security", "--allow-running-insecure-content"
      ]
    }
  }
}

serenity {
  testRoot = "org.choucair"
  requirementsBaseDir = "src/test/resources/features"
  requirementsDir = "src/test/resources/features"
  encoding = "UTF-8"
  compress.filenames = true
  take.screenshots=FOR_FAILURES
  fork.count = 2
}